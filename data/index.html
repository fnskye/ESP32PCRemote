<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Remotely control your PC using an ESP32" />
  <title>Smart PC Power</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    .navbar a {
      position: relative;
      display: inline-block;
      padding: 10px;
      color: white;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .navbar a::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      background-color: #00adb5;
      bottom: 0;
      left: 0;
      transform: scaleX(0);
      transform-origin: bottom right;
      transition: transform 0.3s ease-out;
    }
    .navbar a:hover::after {
      transform: scaleX(1);
      transform-origin: bottom left;
    }
    .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="#home" class="logo">ESP32 Hub</a>
    <nav class="navbar">
      <a href="#home">Home</a>
    </nav>
  </header>

  <section class="home" id="pc-control">
    <div class="home-content">
      <h1>Smart PC Power Control</h1>
      <p>Control your PC remotely using ESP32.</p>
      <button id="powerBtn" class="btn"><i class='bx bx-power-off'></i> Press Power</button>
      <button class="btn" disabled><i class='bx bx-refresh'></i> Restart (Coming Soon)</button>
      <button class="btn" disabled><i class='bx bx-power-off'></i> Shutdown (Coming Soon)</button>
      <p id="statusMsg"></p>
    </div>
  </section>

  <script>
    const statusMsg = document.getElementById("statusMsg");
    const powerBtn = document.getElementById("powerBtn");

    powerBtn.addEventListener("click", () => {
      statusMsg.textContent = "Sending command...";
      fetch("https://0c63-180-191-66-207.ngrok-free.app/trigger", { method: "POST" })
        .then(response => {
          if (!response.ok) throw new Error("Failed to send command");
          return response.text();
        })
        .then(result => {
          statusMsg.textContent = result || "Command sent successfully!";
        })
        .catch(err => {
          statusMsg.textContent = "Error: " + err.message;
        });
    });
  </script>
</body>
</html>
