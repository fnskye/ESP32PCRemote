<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart PC Power</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .navbar a {
      position: relative;
      display: inline-block;
      padding: 10px;
      color: white;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .navbar a::after {
      content: '';
      position: absolute;
      width: 100%;
      transform: scaleX(0);
      height: 2px;
      bottom: 0;
      left: 0;
      background-color: #00adb5;
      transform-origin: bottom right;
      transition: transform 0.3s ease-out;
    }
    .navbar a:hover::after {
      transform: scaleX(1);
      transform-origin: bottom left;
    }
    .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/#" class="logo">ESP32 Hub</a>
    <i class='bx bx-menu' id="menu-icon"></i>
    <nav class="navbar">
      <a href="/#">Home</a>
    </nav>
  </header>

  <section class="home" id="pc-control">
    <div class="home-content">
      <h1>Smart PC Power Control</h1>
      <p>Control your PC remotely using ESP32.</p>
      <button id="powerBtn" class="btn"><i class='bx bx-power-off'></i> Press Power</button>
      <button class="btn" disabled><i class='bx bx-refresh'></i> Restart (Coming Soon)</button>
      <button class="btn" disabled><i class='bx bx-power-off'></i> Shutdown (Coming Soon)</button>
      <p id="statusMsg"></p>
    </div>
  </section>

  <script>
    const statusMsg = document.getElementById('statusMsg');

    async function sendCommand(endpoint) {
      statusMsg.textContent = "Sending command...";
      try {
        const response = await fetch(`http://192.168.254.153/${endpoint}`, {
          method: "POST"
        });

        if (!response.ok) throw new Error("Failed to send command");
        const result = await response.text();
        statusMsg.textContent = result || "Command sent successfully!";
      } catch (err) {
        statusMsg.textContent = "Error: " + err.message;
      }
    }

    document.getElementById('powerBtn').addEventListener('click', () => sendCommand('trigger'));
  </script>
</body>
</html>
